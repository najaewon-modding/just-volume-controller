name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Synchronize existing release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for notes in .github/release-notes/v*.md; do
            tag="$(basename "$notes" .md)"

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$notes"
            fi
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          artifact="build/libs/njw_volume_desk-${RELEASE_VERSION}.jar"
          notes=".github/release-notes/${RELEASE_TAG}.md"
          test -f "$artifact"
          test -f "$notes"
          gh release create "$RELEASE_TAG" "$artifact" \
            --target "$GITHUB_SHA" \
            --title "Volume Desk ${RELEASE_VERSION}" \
            --notes-file "$notes"
